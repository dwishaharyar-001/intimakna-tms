services:
  db:
    image: postgres:16-alpine
    container_name: intimakna-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intimakna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intimakna_dev}
      POSTGRES_DB: ${POSTGRES_DB:-intimakna_tms}
    ports:
      - '5433:5432'
    volumes:
      - intimakna_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-intimakna} -d ${POSTGRES_DB:-intimakna_tms}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  intimakna_pgdata:
